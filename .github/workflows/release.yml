# Release pipeline.
#
# WHY THIS FILE LOOKS THE WAY IT DOES
# -----------------------------------
# Upstream agent-universe v2.5.6 had three separate release workflows
# (`release.yml`, `release-crates.yml`, `publish.yml`) that all triggered
# independently on `push: tags: ["v*"]` and had NO `needs:` relationship to any
# test job. Tagging a commit therefore published packages immediately, whether or
# not the tests for that commit had ever passed — an untested tag shipped. There
# was also no check that the tag agreed with the version in the manifests, so
# `v9.9.9` on a `1.0.1` tree published a `9.9.9` release.
#
# This file fixes both by construction:
#
#   * it triggers ONLY on a `v*` tag or a manual dispatch;
#   * the four jobs are chained (`verify -> guard -> prepare -> publish`) with
#     real `needs:` edges, so nothing can publish before the suite has run;
#   * `verify` calls `.github/workflows/ci.yml` through `workflow_call`, which is
#     the *same* file that runs on every push, so there is no second copy of the
#     test steps to drift out of date;
#   * `guard` fails unless the tag string equals the contents of `VERSION`.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v1.0.1)"
        required: true

# Workflow-level permissions, declared once. `contents: write` is required to
# create the GitHub Release; nothing here needs any other scope.
permissions:
  contents: write

jobs:
  # 1. The full test suite, reused verbatim from ci.yml. No release can proceed
  #    unless every job in that file passes.
  verify:
    name: verify
    uses: ./.github/workflows/ci.yml

  # 2. The version guard. Runs after the tests, and gates the build.
  guard:
    name: tag agrees with VERSION
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assert the tag equals the VERSION file
        id: check
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "::error::VERSION is empty"
            exit 1
          fi

          # The tag comes from the ref for a tag push, or from the dispatch input.
          ref="${{ github.event.inputs.tag }}"
          if [ -z "$ref" ]; then
            ref="${GITHUB_REF_NAME}"
          fi
          tag="${ref#v}"

          echo "VERSION=$version tag=${GITHUB_REF_NAME} ref=$ref"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$ref' does not match VERSION ($version); refusing to publish"
            exit 1
          fi

          # VERSION is the single source of truth; Cargo.toml must agree. The
          # `version` job in ci.yml already checked this, but a release decision
          # should not rest on another job's output being parsed correctly.
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' | head -n1)"
          test "$cargo_version" = "$version" || {
            echo "::error::Cargo.toml says $cargo_version, VERSION says $version"
            exit 1
          }

          # A release should be able to name what changed. The file is not
          # tracked in this tree yet, so a missing CHANGELOG is a warning rather
          # than a hard stop; a CHANGELOG that *exists* but has no entry for this
          # version is a failure.
          if [ -f CHANGELOG.md ]; then
            grep -qF "$version" CHANGELOG.md || {
              echo "::error::CHANGELOG.md has no entry for $version"
              exit 1
            }
          else
            echo "::warning::CHANGELOG.md is not tracked; skipping the changelog check"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

  # 3. Build the release binaries. Only reachable when `guard` passed.
  prepare:
    name: build release binaries
    runs-on: ubuntu-latest
    needs: guard
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.83.0
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd52fe3686f74de0a6bc # stable branch, pinned
        with:
          toolchain: "1.83.0"

      - name: Build the release binaries
        run: cargo build --workspace --release --locked

      - name: Stage the artifacts
        run: |
          set -eu
          mkdir -p dist
          for bin in nau nau-daemon; do
            if [ -f "target/release/$bin" ]; then
              cp "target/release/$bin" "dist/$bin"
            else
              echo "::error::expected release binary target/release/$bin was not produced"
              exit 1
            fi
          done
          cd dist
          sha256sum nau nau-daemon > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the staged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nau-release-${{ needs.guard.outputs.version }}
          path: dist/*
          if-no-files-found: error

  # 4. Publish. `needs: prepare` is the last edge in the chain, so the release
  #    cannot exist unless the tests, the version guard and the build all passed.
  publish:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: [guard, prepare]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download the built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nau-release-${{ needs.guard.outputs.version }}
          path: dist

      - name: Assert the artifacts exist before publishing anything
        run: |
          set -eu
          ls -la dist
          for bin in nau nau-daemon; do
            test -x "dist/$bin" || test -f "dist/$bin"
          done
          test -f dist/SHA256SUMS

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          name: ${{ needs.guard.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/nau
            dist/nau-daemon
            dist/SHA256SUMS

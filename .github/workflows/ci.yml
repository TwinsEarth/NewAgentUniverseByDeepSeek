# Continuous integration for NewAgentUniverseByDeepSeek.
#
# WHY THIS FILE LOOKS THE WAY IT DOES
# -----------------------------------
# Upstream agent-universe v2.5.6 shipped CI that did not actually gate anything:
#
#   * `cargo clippy` ended in `|| echo "tolerated"`, so every lint was advisory
#     and the job was green regardless of what clippy found.
#   * the Python suite skipped 11 of its 17 tests because the workflow never
#     installed `cryptography`; the skips were reported as success.
#   * Solidity was never compiled. The "contract" check grepped the sources for
#     the string "pragma solidity", so a file of comments would have passed.
#   * every action was referenced by a floating major tag (`@v4`), so a breaking
#     or compromised upstream release could change the build with no diff here.
#
# This workflow is genuinely gating: every step below fails the job on a real
# failure, no step is wrapped in `|| echo`, and every action is pinned to an
# exact version. If a check is not worth failing the build for, it does not
# belong here.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # `workflow_call` is what lets `release.yml` reuse this file instead of
  # re-implementing (and slowly diverging from) the test steps.
  workflow_call:

# Least privilege by default. The release workflow that calls this one declares
# `contents: write` for itself; these jobs never need it.
permissions:
  contents: read

# The Rust toolchain is pinned to an exact version. A floating `stable` is a
# different compiler every few weeks, which is how "works on my machine" becomes
# "the build broke overnight with no commits".
env:
  RUST_TOOLCHAIN: "1.83.0"
  # CARGO_BUILD_JOBS bounds concurrent rustc processes, exactly as
  # `.cargo/config.toml` documents for local builds. 8 concurrent rustc
  # processes OOM a 16 GB machine: the upstream build died with
  # `rustc-LLVM ERROR: out of memory / Allocation failed`. CI runners are
  # smaller than that, so the bound is lowered to 2 here and cargo's own
  # default is never allowed to win.
  CARGO_BUILD_JOBS: "2"
  # Fail a job that hangs rather than occupying a runner for six hours.
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd52fe3686f74de0a6bc # stable branch, pinned
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Assert Cargo.lock is in sync with the manifests
        # `--locked` below fails *during* the build when the lock file is stale;
        # this reports the same problem in one second, with a readable message.
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: cargo build --workspace --locked
        run: cargo build --workspace --locked

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        # A REAL gate. No `|| echo "tolerated"`: a warning is a failed job.
        # `--all-targets` includes tests, benches and examples, which upstream's
        # clippy invocation skipped.
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Prove the Python SDK needs no dependencies
        # The SDK is dependency-free by design. Upstream's workflow never
        # installed `cryptography`, so 11 of its 17 tests skipped themselves and
        # the job still went green. If `site-packages` is ever needed here, the
        # "dependency-free" claim in sdks/python/README.md is false and this
        # step is the place that says so.
        run: |
          python -c "import sys; print(sys.version)"
          python - <<'PY'
          import importlib.util
          for forbidden in ("cryptography", "nacl", "ed25519"):
              if importlib.util.find_spec(forbidden) is not None:
                  raise SystemExit(
                      f"{forbidden} is importable in CI; the SDK must not depend on it"
                  )
          print("no third-party crypto package is present")
          PY

      - name: Assert the SDK's runner exists
        # This job is a gate, so a missing runner is a failure, not a skip. The
        # message says exactly what is wrong so it cannot be mistaken for a
        # toolchain problem. (Upstream's Python job never installed
        # `cryptography`, so 11 of its 17 tests skipped and the job still passed;
        # a silent skip is the failure mode this step exists to prevent.)
        run: |
          set -eu
          if [ ! -f sdks/python/run_tests.py ]; then
            echo "::error::sdks/python/run_tests.py does not exist; the Python SDK is part of this release and must be present"
            exit 1
          fi
          ls -la sdks/python

      - name: Run the SDK's own test runner
        # No `pip install`, and no `|| true`: the runner's exit code is the gate.
        # A skip-only run must not be able to masquerade as a pass — the SDK's
        # runner exits non-zero when a test cannot run.
        run: python sdks/python/run_tests.py

  js:
    name: javascript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"

      - name: Run the JS SDK test suite
        # As with the Python job, a missing runner is a failure rather than a
        # skip, and the message says why.
        run: |
          set -eu
          if [ ! -f sdks/js/test/run.js ]; then
            echo "::error::sdks/js/test/run.js does not exist; the JS SDK is part of this release and must be present"
            exit 1
          fi
          node sdks/js/test/run.js

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The diff check below needs to see changes to the working tree.
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"

      - name: Regenerate the conformance vectors
        run: |
          set -eu
          if [ ! -f conformance/generate.mjs ]; then
            echo "::error::conformance/generate.mjs does not exist; the cross-language fixture cannot be reproduced"
            exit 1
          fi
          node conformance/generate.mjs

      - name: Assert the checked-in vectors are reproducible from the generator
        # THIS is the cross-language guarantee upstream never had. The generator
        # shares no code with the Rust implementation and uses Node's own
        # OpenSSL Ed25519 + an independent canonicalizer, so if the checked-in
        # fixture still matches after regeneration, the canonical rules in
        # conformance/vectors.json are reproducible by a second implementation.
        # A float, a key-order change or a nesting-limit drift shows up here as a
        # diff rather than as a signature that mysteriously fails to verify.
        run: |
          git add -N conformance/vectors.json
          git diff --exit-code -- conformance/vectors.json

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1
        with:
          version: v1.3.4

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Static contract and workflow checks
        # Structural checks only: balanced delimiters, a `returns` for every
        # declared return value, `// upstream v2.5.6 fix:` markers present for
        # every documented defect, the required test names present, and every
        # workflow YAML-parseable with every action pinned to a commit SHA.
        # This is NOT a substitute for `forge build` — it runs before and
        # alongside it, and it needs no toolchain.
        run: |
          set -eu
          python contracts/verify_static.py
          python contracts/verify_api.py

      - name: Show the toolchain that is about to build
        run: forge --version

      - name: Fetch forge-std (the only external dependency)
        # Pinned in contracts/foundry.toml's remappings. `--no-commit` because CI
        # must not depend on committing a submodule; the version is pinned here
        # so the build is reproducible. If the tree later tracks `lib/forge-std`
        # as a submodule, drop the `--no-commit` flag — `forge install` refuses
        # to install into a submodule path.
        run: forge install foundry-rs/forge-std@v1.9.4 --no-commit

      - name: forge fmt --check
        run: forge fmt --check

      - name: forge build --sizes
        # Compiling is the check. Upstream grepped for the string "pragma
        # solidity", which a file of comments satisfies.
        run: forge build --sizes

      - name: forge test -vvv
        run: forge test -vvv

      - name: Assert contracts/VERSION mirrors the repository VERSION
        # The contracts must not carry an independently drifting version. This is
        # the same single-source-of-truth rule as `[workspace.package] version`
        # and the SDKs; `script/Deploy.s.sol` reads contracts/VERSION at run time
        # and refuses to deploy when the deploy config disagrees with it.
        run: |
          set -eu
          test -f contracts/VERSION
          diff -u VERSION contracts/VERSION
          echo "contracts/VERSION matches VERSION"

      - name: Assert the deploy script actually reads VERSION
        # A behavioural check on the sources: the deploy script must read the
        # VERSION file rather than restating the number. If somebody replaces the
        # read with a literal, this fails.
        run: |
          set -eu
          grep -qF 'readAndTrim("VERSION")' contracts/script/Deploy.s.sol
          grep -q 'VersionMismatch' contracts/script/Deploy.s.sol
          echo "Deploy.s.sol reads VERSION and refuses to deploy on a mismatch"

  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: VERSION agrees with [workspace.package] version
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version" || { echo "VERSION is empty"; exit 1; }
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' | head -n1)"
          echo "VERSION=$version  [workspace.package] version=$cargo_version"
          test "$version" = "$cargo_version" || {
            echo "::error::VERSION ($version) != [workspace.package] version ($cargo_version)"
            exit 1
          }
          for manifest in crates/*/Cargo.toml; do
            if grep -q '^\[package\]' "$manifest"; then
              declared="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$manifest" | head -n1)"
              if [ -n "$declared" ] && [ "$declared" != "$version" ]; then
                echo "::error::$manifest declares $declared, expected $version"
                exit 1
              fi
            fi
          done

      - name: No SDK hardcodes the version
        # The SDks must read VERSION (or receive it), never restate it. This is
        # the check that stops a second source of truth from appearing.
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          # Normalise to a regex-safe literal for the grep.
          pattern="$(printf '%s' "$version" | sed 's/\./\\./g')"
          status=0
          for dir in sdks/python sdks/js; do
            if [ ! -d "$dir" ]; then
              echo "::warning::$dir does not exist yet; nothing to scan"
              continue
            fi
            if grep -rn --include='*.py' --include='*.js' --include='*.mjs' \
                 --include='*.ts' --include='*.json' \
                 -E "\"$pattern\"|'$pattern'" "$dir"; then
              echo "::error::$dir hardcodes the version string $version; read VERSION instead"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then exit 1; fi
          echo "no SDK restates the version"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ShellCheck every shell script
        # `shellcheck` is preinstalled on ubuntu-latest. Upstream ran no shell
        # linting at all, so a broken release script was only discovered when a
        # tag was already pushed.
        run: |
          set -eu
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts tracked; nothing to lint"
            exit 0
          fi
          printf 'linting %s\n' "${scripts[@]}"
          shellcheck --version
          shellcheck --severity=warning "${scripts[@]}"

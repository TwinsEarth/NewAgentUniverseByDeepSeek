nau-core.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
# OS entropy for STUN transaction ids: a 96-bit id that an off-path attacker
# must not be able to predict, because it is what binds a Binding Response to the
# Binding Request that caused it.
rand.workspace = true
thiserror.workspace = true

